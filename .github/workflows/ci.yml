name: CI — Typecheck, Lint, Tests, and Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Lint Firestore security rules
        run: npm run rules:lint

      - name: Run unit & validation tests
        run: npm test

      - name: Build production bundle
        run: npm run build
